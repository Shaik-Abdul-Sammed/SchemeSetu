<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="SchemeSetu - Voice-First Multilingual Government Scheme Discovery & Citizen Welfare Portal for SIH 2026" />
    <meta name="theme-color" content="#0B192C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchemeSetu" />
    <meta name="application-name" content="SchemeSetu" />
    
    <!-- Icons & Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0B192C" />
    
    <!-- Open Graph & Social SEO Meta Tags -->
    <meta property="og:title" content="SchemeSetu - AI-Powered Citizen Scheme & Welfare Portal" />
    <meta property="og:description" content="Voice-first multilingual platform for citizens and micro-entrepreneurs to discover, check eligibility, and apply for government welfare schemes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SchemeSetu - AI Government Scheme Portal" />
    <meta name="twitter:image" content="/icon-512.png" />
    
    <title>SchemeSetu - Voice-First Government Scheme Discovery Portal</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Google Translate Full-Page Translation Integration -->
    <div id="google_translate_element" style="position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'hi,te,ta,kn,ml,mr,bn,pa,gu,ur,or,as,en',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch (e) {}
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          // Unregister any stale service workers in local development to avoid HMR and asset interception
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Registration notice:', err.message));
          });
        }
      }
    </script>
  </body>
</html>
