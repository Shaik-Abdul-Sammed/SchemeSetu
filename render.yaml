# Render.com Free Tier Deployment Blueprint for SchemeSetu
services:
  - type: web
    name: schemesetu-backend-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node backend/src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
