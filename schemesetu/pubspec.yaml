name: chit_fund_app
description: SanghaSetu - Offline-First Financial Management Platform.
version: 1.1.0+2

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.6
  provider: ^6.1.2

  # Storage & Auth
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1  # Replaces plain SharedPreferences for PIN
  local_auth: ^3.0.1
  crypto: ^3.0.3

  # PDF & Reports
  pdf: ^3.10.7
  printing: ^5.11.1

  # Utils
  url_launcher: ^6.2.5
  http: ^1.6.0
  socket_io_client: ^3.1.6
  intl: ^0.20.2
  image_picker: ^1.0.7
  google_fonts: ^8.1.0
  path_provider: ^2.1.2
  path_provider_platform_interface: ^2.1.3
  xdg_directories: ^1.0.4
  share_plus: ^12.0.2
  translator: ^1.0.3

  # Notifications
  flutter_local_notifications: ^22.0.1

  # UI Enhancements
  fl_chart: ^1.2.0     # Analytics charts for dashboard
  shimmer: ^3.0.0        # Skeleton loading states
  table_calendar: ^3.2.0
  flutter_animate: ^4.5.2
  flutter_contacts: ^2.2.2
  permission_handler: ^12.0.3
  drift: ^2.34.0
  encrypt: ^5.0.3
  path: ^1.9.0
  flutter_riverpod: ^3.3.2
  timezone: ^0.11.1
  riverpod_annotation: ^4.0.3
  sqlite3: ^3.5.0
  collection: ^1.18.0
  file_picker: ^11.0.2
  flutter_bloc: ^8.1.3
  csv: ^8.0.0
  speech_to_text: ^7.4.0
  google_sign_in: ^6.2.1
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  logger: ^2.7.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_image_compress: ^2.5.0
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.6.4
  mocktail: ^1.0.0
  bloc_test: ^9.1.0
  integration_test:
    sdk: flutter
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"




